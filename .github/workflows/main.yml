name : Calculator-deploy
on: 
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
            username: ${{secrets.DOCKER_USERNAME}}
            password: ${{secrets.DOCKERHUB_TOKEN}}
      - name: Build Docker image
        run: |
          docker build -t ${{secrets.DOCKER_USERNAME}}/calculator:latest .
          
      - name: Push Docker image
        run: |
          docker push ${{secrets.DOCKER_USERNAME}}/calculator:latest
      
      - name: Deploy application on GCP VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.GCP_VM_HOST}}
          username: ${{secrets.GCP_VM_USERNAME}}
          key: ${{secrets.GCP_VM_SSH_KEY}}
          script: |
            echo "Pulling latest Docker image..."
            docker pull ${{secrets.DOCKER_USERNAME}}/calculator:latest
            echo "Stopping old container..."
            docker stop calculator || true
            echo "Removing old container..."
            docker rm calculator || true
            echo "Starting new container..."
            docker run -d --name calculator -p 80:80 ${{secrets.DOCKER_USERNAME}}/calculator:latest
            echo "Deployment completed!"
            docker ps

      
